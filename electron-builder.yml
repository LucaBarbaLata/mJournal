# Packaging for mJournal. Produces, in ./release:
#   npm run dist (on Windows)
#     mJournal-Setup-<version>.exe     installer with Start menu and desktop shortcuts (no admin needed)
#     mJournal-<version>-portable.exe  runs without installing
#   npm run dist:linux (on Linux; electron-builder can't make these on Windows)
#     mjournal_<version>_amd64.deb     installs into the app menu (Ubuntu, Zorin OS, Mint, Debian…)
#     mJournal-<version>.AppImage      one file that runs on most distributions
appId: app.mjournal
productName: mJournal
copyright: Copyright © 2026 lucariki
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
# mJournal's license and those of the packages inside it, next to mJournal.exe.
extraFiles:
  - from: LICENSE
    to: LICENSE.txt
  - from: THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
# No auto-updater (and no update metadata): mJournal only tells you when GitHub
# has a newer version. Releases are published by .github/workflows/release.yml.
publish: null
# Electron's built-in security switches ("fuses"): the packaged app can't be
# run as plain Node.js, can't be debugged from the command line, and only
# loads its own verified code.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: mJournal
  uninstallDisplayName: mJournal
  # Never delete the journal when the app is uninstalled.
  deleteAppDataOnUninstall: false
  artifactName: mJournal-Setup-${version}.${ext}
portable:
  artifactName: mJournal-${version}-portable.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.lifestyle
  target: [dmg]
linux:
  icon: build/icon.png
  category: Utility
  synopsis: A private journal for gratitude, reflection and everyday memories
  maintainer: lucariki <luca@lucariki.top>
  executableName: mjournal
  # The window, the app menu entry and the dock icon belong together (desktopName in package.json).
  syncDesktopName: true
  desktop:
    entry:
      Keywords: journal;diary;gratitude;mood;memories;
  target:
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
deb:
  artifactName: mjournal_${version}_amd64.${ext}
appImage:
  artifactName: mJournal-${version}.${ext}
toolsets:
  # The newer AppImage runtime. It doesn't need libfuse2 (missing on recent Ubuntu-based systems), and it
  # only turns Chromium's sandbox off where the system blocks it, instead of always (the old runtime's default).
  appimage: 1.0.3
