# Dependabot opens pull requests when dependencies have new versions; the Tests workflow checks each one.
# Electron matters most: only its three newest major versions get security fixes.
# Minor and patch updates come grouped (Electron on its own, everything else together); a new major
# version comes as its own pull request, because it may need changes.
# If a pull request fails only the THIRD-PARTY-NOTICES test, check it out, run `npm run notices` and push.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # @types/node has to match the Node.js inside Electron (process.versions.node), not the newest
      # Node.js. Raise its major version by hand when an Electron update brings a new Node.js.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # These only work together (each new major of Vite needs matching electron-vite and React plugin
      # versions), so they always come in one pull request, major versions included.
      vite:
        patterns: [vite, '@vitejs/*', electron-vite]
      electron:
        patterns: [electron]
        update-types: [minor, patch]
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
