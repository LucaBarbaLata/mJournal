# Builds mJournal on Windows, tests it and puts it on the GitHub Releases page.
#
# To release a version:
#   1. Raise the version: npm version patch --no-git-tag-version (or minor / major), then commit and push.
#   2. On GitHub: Actions → Release → Run workflow, and pick what to make:
#        draft        only you can see it; check it, then press "Publish release" on GitHub
#        pre-release  public, but the app's update check ignores it (a release candidate)
#        release      public, and the app tells people about it
#   Running it with "release" when a pre-release of the same version and commit exists
#   turns that pre-release into the release, without building again.
# The tag (v1.0.0, …) is created when the release is published.
name: Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'draft = only you see it until you publish it · pre-release = public, the app ignores it · release = public, the app announces it (or promotes the pre-release)'
        type: choice
        default: draft
        options: [draft, pre-release, release]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Quick: decides whether anything needs building, and promotes a release candidate.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check what's on the Releases page
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease 2>$null
          $existing = if ($LASTEXITCODE -eq 0 -and $json) { $json | ConvertFrom-Json } else { $null }
          $build = 'true'
          if ($existing -and -not $existing.isDraft) {
            if (-not $existing.isPrerelease) {
              throw "mJournal $version is already released. To release newer changes, raise the version (npm version patch --no-git-tag-version), commit, push and run this again."
            }
            # Changes to the workflow and the docs since the pre-release don't change the app.
            $changed = gh api "repos/$env:GITHUB_REPOSITORY/compare/$tag...$env:GITHUB_SHA" --jq '.files[].filename' 2>$null
            if ($LASTEXITCODE -ne 0) { throw "GitHub couldn't compare this commit with the $tag pre-release. Try again in a moment." }
            $appChanges = @($changed | Where-Object { $_ -and $_ -notmatch '^(\.github/|docs/)|\.md$' })
            if ($appChanges.Count -gt 0) {
              throw "The app has changed since the mJournal $version pre-release was built. To release your newer changes, raise the version (npm version patch --no-git-tag-version), commit, push and run this again."
            }
            if ($env:KIND -ne 'release') {
              throw "mJournal $version is already a pre-release, and the app hasn't changed since. Run this again with 'release' to publish that same build."
            }
            # The release candidate becomes the release: the same files, now announced to everyone.
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "Published the mJournal $version pre-release as the release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            $build = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          exit 0

  release:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    # Generous: packing the portable app can stall while a virus scanner reads it.
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The electron package has no install script; this fetches its runtime for the tests.
      - name: Download the Electron runtime
        run: node node_modules/electron/install.js

      - name: Type-check and test (unit and end-to-end)
        run: npm run verify

      - name: Build the installer and the portable app
        run: npm run dist

      - name: Write checksums
        shell: pwsh
        run: |
          Get-FileHash "release/mJournal-Setup-$env:VERSION.exe", "release/mJournal-$env:VERSION-portable.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Put it on the Releases page
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
        run: |
          $tag = "v$env:VERSION"
          # A draft left by an earlier run for this version is replaced.
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0 -and $json -and ($json | ConvertFrom-Json).isDraft) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes
          }
          $flag = @{ 'draft' = '--draft'; 'pre-release' = '--prerelease'; 'release' = '--latest' }[$env:KIND]
          gh release create $tag `
            "release/mJournal-Setup-$env:VERSION.exe" `
            "release/mJournal-$env:VERSION-portable.exe" `
            release/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "mJournal $env:VERSION" `
            --generate-notes `
            $flag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Made a $env:KIND for mJournal ${env:VERSION}: https://github.com/$env:GITHUB_REPOSITORY/releases"
