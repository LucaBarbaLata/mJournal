# Builds mJournal for Windows and Linux, tests it on both and puts it on the GitHub Releases page.
#
# To release a version:
#   1. Raise the version: npm version patch --no-git-tag-version (or minor / major), then commit and push.
#   2. On GitHub: Actions → Release → Run workflow, and pick what to make:
#        draft        only you can see it; check it, then press "Publish release" on GitHub
#        pre-release  public, but the app's update check ignores it (a release candidate)
#        release      public, and the app tells people about it
#   Running it with "release" when a pre-release of the same version and commit exists
#   turns that pre-release into the release, without building again.
# The tag (v1.0.0, …) is created when the release is published.
name: Release

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'draft = only you see it until you publish it · pre-release = public, the app ignores it · release = public, the app announces it (or promotes the pre-release)'
        type: choice
        default: draft
        options: [draft, pre-release, release]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Quick: decides whether anything needs building, and promotes a release candidate.
  check:
    runs-on: ubuntu-latest
    # Write access only for promoting a pre-release.
    permissions:
      contents: write
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check what's on the Releases page
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $json = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,isPrerelease 2>$null
          $existing = if ($LASTEXITCODE -eq 0 -and $json) { $json | ConvertFrom-Json } else { $null }
          $build = 'true'
          if ($existing -and -not $existing.isDraft) {
            if (-not $existing.isPrerelease) {
              throw "mJournal $version is already released. To release newer changes, raise the version (npm version patch --no-git-tag-version), commit, push and run this again."
            }
            # Changes to the workflow and the docs since the pre-release don't change the app.
            $changed = gh api "repos/$env:GITHUB_REPOSITORY/compare/$tag...$env:GITHUB_SHA" --jq '.files[].filename' 2>$null
            if ($LASTEXITCODE -ne 0) { throw "GitHub couldn't compare this commit with the $tag pre-release. Try again in a moment." }
            $appChanges = @($changed | Where-Object { $_ -and $_ -notmatch '^(\.github/|docs/)|\.md$' })
            if ($appChanges.Count -gt 0) {
              throw "The app has changed since the mJournal $version pre-release was built. To release your newer changes, raise the version (npm version patch --no-git-tag-version), commit, push and run this again."
            }
            if ($env:KIND -ne 'release') {
              throw "mJournal $version is already a pre-release, and the app hasn't changed since. Run this again with 'release' to publish that same build."
            }
            # The release candidate becomes the release: the same files, now announced to everyone.
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --prerelease=false --latest
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "Published the mJournal $version pre-release as the release: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag"
            $build = 'false'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          exit 0

  windows:
    name: Windows build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    # Generous: packing the portable app can stall while a virus scanner reads it.
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The electron package has no install script; this fetches its runtime for the tests.
      - name: Download the Electron runtime
        run: node node_modules/electron/install.js

      - name: Type-check and test (unit and end-to-end)
        run: npm run verify

      - name: Build the installer and the portable app
        run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            release/mJournal-Setup-${{ env.VERSION }}.exe
            release/mJournal-${{ env.VERSION }}-portable.exe
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux build
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Download the Electron runtime
        run: node node_modules/electron/install.js

      # Ubuntu 24.04 lets only programs with an AppArmor profile use the kernel feature Chromium's
      # sandbox relies on. The Electron the tests start has none (the .deb installs one), so allow it here.
      - name: Let the test copy of Electron use its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # There is no screen on the runner; xvfb-run gives the app a virtual one.
      - name: Type-check and test (unit and end-to-end)
        run: xvfb-run --auto-servernum npm run verify

      - name: Build the .deb and the AppImage
        run: npm run dist:linux

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            release/mjournal_${{ env.VERSION }}_amd64.deb
            release/mJournal-${{ env.VERSION }}.AppImage
          if-no-files-found: error
          retention-days: 3

  # Only runs when both builds passed, so a release always has every file.
  publish:
    name: Put it on the Releases page
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum -- "mJournal-Setup-$VERSION.exe" "mJournal-$VERSION-portable.exe" \
            "mjournal_${VERSION}_amd64.deb" "mJournal-$VERSION.AppImage" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Put it on the Releases page
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
        run: |
          tag="v$VERSION"
          # A draft left by an earlier run for this version is replaced.
          if [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          case "$KIND" in
            draft) flag=--draft ;;
            pre-release) flag=--prerelease ;;
            *) flag=--latest ;;
          esac
          gh release create "$tag" \
            "mJournal-Setup-$VERSION.exe" \
            "mJournal-$VERSION-portable.exe" \
            "mjournal_${VERSION}_amd64.deb" \
            "mJournal-$VERSION.AppImage" \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "mJournal $VERSION" \
            --generate-notes \
            "$flag"
          echo "Made a $KIND for mJournal $VERSION: https://github.com/$GITHUB_REPOSITORY/releases"
